# A closed issue reopens when somebody other than the maintainer comments on
# it, so a reporter who finds more data does not need to file a new one. Issues
# closed as "not planned" and locked issues stay closed. No third-party
# actions; gh is on the runner.
name: Reopen on comment

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  reopen:
    if: >-
      github.event.issue.state == 'closed' &&
      !github.event.issue.pull_request &&
      !github.event.issue.locked &&
      github.event.issue.state_reason != 'not_planned' &&
      github.event.comment.user.type != 'Bot' &&
      github.event.comment.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          gh issue reopen "$NUMBER" --repo "$REPO" \
            --comment "Reopened because @$COMMENTER added to it after it was closed. It will be looked at again."
