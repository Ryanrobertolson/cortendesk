# Actions are pinned to commit SHAs (tag in the trailing comment); bump by hand.
name: Security scan

# composer audit, npm audit and gitleaks fail the build. Semgrep only
# reports: its findings go to the repository's code scanning tab, which only
# people with write access can see.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # weekly, to catch new advisories for locked dependencies
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer
      - run: composer audit --locked --no-interaction

  # The web client's dependencies are all dev tooling except four runtime
  # libraries, and the built bundle is committed, so only the lockfile is
  # audited. Moderate and low advisories are left to Dependabot alerts.
  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webclient
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm audit --audit-level=high

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            git /repo --config /repo/.gitleaks.toml --no-banner --redact --exit-code 1

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.180.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # public/rdclient is the esbuild output of webclient/src, which is
      # scanned. public/assets/vendor holds minified third-party libraries.
      - run: >
          semgrep scan
          --config p/php --config p/security-audit --config p/javascript
          --config p/typescript --config p/secrets
          --exclude vendor --exclude node_modules
          --exclude public/rdclient --exclude public/assets/vendor
          --metrics off
          --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep
