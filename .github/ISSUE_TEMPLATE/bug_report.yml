name: Bug report
description: Something is broken or behaves differently from the docs.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The fields below are what is needed to reproduce most problems; the more of them you fill in, the faster it gets fixed. Check the [Troubleshooting](https://github.com/marcpope/cortendesk/wiki/Troubleshooting) page first, it covers the usual suspects. If an issue was closed and you have more data, comment on it: that reopens it.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
      placeholder: |
        1. Settings → Server, turned on Require device approval
        2. Installed the client on a new PC
        3. Expected it under Devices → Pending, it never appears
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CortenDesk version
      description: Settings → Maintenance → About, or `GET /api/version` on your console.
      placeholder: "1.13.0"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How CortenDesk is installed
      options:
        - Docker image (docker run or Compose)
        - Manual install (nginx + php-fpm)
        - Other (say what below)
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - MySQL
        - MariaDB
        - SQLite
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: server
    attributes:
      label: ID server and relay (hbbs/hbbr)
      description: What the RustDesk clients connect to.
      options:
        - Bundled in the CortenDesk image (default since 1.5)
        - CortenDesk Server running separately
        - Stock RustDesk server (rustdesk/rustdesk-server)
        - Other / not sure
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: RustDesk client version and platform
      description: As shown in the client's About. Mention every side involved, e.g. "1.4.2 Windows controlling 1.5.0 Ubuntu".
      placeholder: "1.4.2 Windows → 1.5.0 Ubuntu"

  - type: input
    id: browser
    attributes:
      label: Browser (web client issues only)
      placeholder: "Chrome 141 on macOS, console over https"

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Docker: `docker compose logs --tail=200 cortendesk`. Manual install: `storage/logs/laravel.log` and the nginx error log. Web client: the browser console (F12). Remove anything private: keys, passwords, public IPs you do not want shown.
      render: shell

  - type: checkboxes
    id: extras
    attributes:
      label: Also attached
      description: Drag files into the field above or into a comment.
      options:
        - label: Diagnostics export (Diagnostics → Export, a JSON file with the state of every component)
        - label: Screenshots
        - label: Settings → Server values (ID server, relay, API server as the clients see them, key redacted)

  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Reverse proxy in front, SSO in use, custom client builds, anything unusual about the setup.
