name: Feature request
description: Something CortenDesk should do that it does not do today.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way. The situation matters more than the solution; it often points to a better one.
      placeholder: "We give support to new clients. Freshly enrolled devices are only visible to admins, so our supporters cannot see the connection log afterwards."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How it could work from the operator's side. Screens, settings, commands.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: Workarounds, other tools, or "nothing".

  - type: input
    id: version
    attributes:
      label: CortenDesk version
      description: So we know whether you are missing something that already exists.
      placeholder: "1.13.0"

  - type: dropdown
    id: side
    attributes:
      label: Where it lives
      description: The console can only change what the console does. Client-side behaviour belongs to the RustDesk client.
      options:
        - The console (web UI, API, server policy)
        - The bundled ID server / relay
        - The web client
        - Not sure
