name: Question or help
description: Setup questions, "is this supported", "how do I".
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        The [wiki](https://github.com/marcpope/cortendesk/wiki) answers most setup questions; [Troubleshooting](https://github.com/marcpope/cortendesk/wiki/Troubleshooting) covers the usual failures. If it is not there, ask here.

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: CortenDesk version
      placeholder: "1.13.0"

  - type: dropdown
    id: install
    attributes:
      label: How CortenDesk is installed
      options:
        - Docker image (docker run or Compose)
        - Manual install (nginx + php-fpm)
        - Not installed yet

  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Anything relevant. Reverse proxy, where hbbs/hbbr run, SSO, which clients.
